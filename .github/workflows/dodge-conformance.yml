name: Validate DODGE 0.2.1 Conformance

on:
  pull_request:
    paths:
      - "game/**"
      - "tools/validate_wretched_dodge.py"
      - ".github/workflows/dodge-conformance.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tools/validate_wretched_dodge.py"
      - ".github/workflows/dodge-conformance.yml"
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout The Fountain
        uses: actions/checkout@v4
        with:
          path: the-fountain
      - name: Checkout pinned DODGE 0.2.1 candidate
        uses: actions/checkout@v4
        with:
          repository: jmbjr/DODGE
          ref: aa0813eb29d3015e5ff980e3cf13821c7539f903
          path: dodge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.23,<5"
      - name: Validate active Wretched documents
        working-directory: the-fountain
        run: |
          python tools/validate_wretched_dodge.py --schema-root ../dodge/draft/v0.2.1
          python -m py_compile tools/resolve_wretched_dodge.py tools/export_wretched_beta_pnp.py
          python tools/resolve_wretched_dodge.py --export-contract game/export-contracts/wretched-beta-pnp.dodge-export.json --out /tmp/wretched-resolved.json
          python -c 'import json; r=json.load(open("/tmp/wretched-resolved.json")); assert r["format"]=="wretched-resolved-game.v1"; assert r["scenario_id"]=="scenario-01"; assert r["inventory"]["representations"]; assert {x["object_ref"] for x in r["inventory"]["unresolved"]}=={"spider-corpse","chrysalis"}; inv=r["inventory"]["representations"]; assert sum(x["quantity"] for x in inv if x["representation_ref"]=="health-unit-tokens")==41; assert sum(x["quantity"] for x in inv if x["role"]=="marker")==10'
