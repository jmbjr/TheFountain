name: Validate DODGE 0.2.1 Conformance

on:
  pull_request:
    paths:
      - "game/**"
      - "tools/validate_wretched_dodge.py"
      - "tools/wretched_semantic_validation.py"
      - "tests/test_wretched_validation.py"
      - "tests/wretched-runtime.test.mjs"
      - "src/wretched/**"
      - "tools/resolve_wretched_dodge.py"
      - "tools/export_wretched_beta_pnp.py"
      - ".github/workflows/dodge-conformance.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tools/validate_wretched_dodge.py"
      - "tools/wretched_semantic_validation.py"
      - "tests/test_wretched_validation.py"
      - "tests/wretched-runtime.test.mjs"
      - "src/wretched/**"
      - "tools/resolve_wretched_dodge.py"
      - "tools/export_wretched_beta_pnp.py"
      - ".github/workflows/dodge-conformance.yml"
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout The Fountain
        uses: actions/checkout@v4
        with:
          path: the-fountain
      - name: Checkout pinned DODGE 0.2.1 candidate
        uses: actions/checkout@v4
        with:
          repository: jmbjr/DODGE
          ref: 7533795a7631d39fbcb27724e3ff56e6c6852fb9
          path: dodge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.23,<5"
      - name: Validate active Wretched documents and resolved PnP manifest
        working-directory: the-fountain
        run: |
          python tools/validate_wretched_dodge.py --schema-root ../dodge/draft/v0.2.1
          python -m py_compile tools/resolve_wretched_dodge.py tools/wretched_semantic_validation.py tools/export_wretched_beta_pnp.py
          python -m unittest tests/test_wretched_validation.py
          npm test
          python tools/resolve_wretched_dodge.py --export-contract game/export-contracts/wretched-beta-pnp.dodge-export.json --out /tmp/wretched-resolved.json --manifest-out /tmp/wretched-pnp-manifest.json
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema=json.load(open("../dodge/draft/v0.2.1/schemas/dodge-target-manifest.schema.v0.2.1.json"))
          manifest=json.load(open("/tmp/wretched-pnp-manifest.json"))
          Draft202012Validator(schema).validate(manifest)
          resolved=json.load(open("/tmp/wretched-resolved.json"))
          assert resolved["format"]=="wretched-resolved-game.v1"
          expected_decks={"captain":10,"security":10,"engineer":10,"medic":11,"scout":10}
          for crew,total in expected_decks.items():
              collection=resolved["semantic_collections"][f"{crew}-starter-deck-1"]
              assert collection["object_ref"]==f"scenario-{crew}-starter-deck"
              assert sum(m.get("quantity",1) for m in collection["members"])==total
          expected_runtime_collections={"scenario-room-cards-1":10,"scenario-encounter-cards-1":6,"scenario-salvage-cards-1":8}
          for instance_id,total in expected_runtime_collections.items():
              assert sum(m.get("quantity",1) for m in resolved["semantic_collections"][instance_id]["members"])==total
          resources=resolved["rules"]["resources"]
          assert resources["actions"]["default"]==3
          assert resources["hand-size"]["default"]==5
          assert (resources["ammunition"]["default"],resources["ammunition"]["maximum"])==(8,12)
          assert (resources["threat"]["default"],resources["threat"]["maximum"])==(0,12)
          assert resolved["scenario_id"]=="scenario-01"
          assert {x["object_ref"] for x in resolved["inventory"]["unresolved"]}=={"spider-corpse","chrysalis"}
          inv=resolved["inventory"]["representations"]
          assert sum(x["quantity"] for x in inv if x["representation_ref"]=="health-unit-tokens")==41
          assert sum(x["quantity"] for x in inv if x["role"]=="marker")==10
          by={x["content_id"]:x for x in manifest["contents"]}
          assert by["scene/scenario-01-the-cave/instance/scenario-token-supply-1/member/0"]["resolved_quantity"]==8
          assert by["scene/scenario-01-the-cave/instance/scenario-token-supply-1/member/1"]["resolved_quantity"]==4
          expected_enemy_supplies={0:6,1:4,2:2,3:1,4:2}
          for member_index,quantity in expected_enemy_supplies.items():
              entry=by[f"scene/scenario-01-the-cave/instance/enemy-token-supply-1/member/{member_index}"]
              assert entry["resolved_quantity"]==quantity
              assert any(d["classification"]=="noncanonical-playtest" and d["field"]=="quantity" for d in entry["diagnostics"])
          assert by["representation/health-unit-tokens/component/0"]["resolved_quantity"]==41
          assert any(d["classification"]=="noncanonical-playtest" for d in by["scene/scenario-01-the-cave/instance/scenario-token-supply-1/member/0"]["diagnostics"])
          starter_decks={"captain-starter-deck-1":10,"security-starter-deck-1":10,"engineer-starter-deck-1":10,"medic-starter-deck-1":11,"scout-starter-deck-1":10}
          printable_instances=["crew-reference-cards-1",*starter_decks,"scenario-room-cards-1","scenario-encounter-cards-1","scenario-salvage-cards-1","enemy-reference-cards-1"]
          for instance_id in printable_instances:
              prefix=f"scene/scenario-01-the-cave/instance/{instance_id}/member/"
              entries=[x for x in manifest["contents"] if x["content_id"].startswith(prefix)]
              assert entries and all(x["source"]["ref"].startswith("scenario-mvp:") for x in entries)
          for instance_id,total in starter_decks.items():
              prefix=f"scene/scenario-01-the-cave/instance/{instance_id}/member/"
              assert sum(x["resolved_quantity"] for x in manifest["contents"] if x["content_id"].startswith(prefix))==total
          assert not any("prototype-action-cards" in x["content_id"] for x in manifest["contents"])
          assert not any("/instance/security-deck-1" in x["content_id"] for x in manifest["contents"])
          assert "security-starter-deck" not in resolved["objects"]
          assert all(resolved["semantic_collections"][f"{crew}-starter-deck-1"]["object_ref"]==f"scenario-{crew}-starter-deck" for crew in expected_decks)
          primary=[x for x in manifest["contents"] if not x.get("parent_content_id") and x["inclusion"]!="excluded-override"]
          assert any(x["content_id"].endswith("/instance/captain-starter-deck-1") for x in primary)
          assert any(x["content_id"].endswith("/instance/scenario-room-cards-1") for x in primary)
          included=[x for x in manifest["contents"] if x["inclusion"]!="excluded-override"]
          assert included
          assert all("source" in x and "provenance" in x and "resolved_quantity" in x for x in included)
          assert any(any(d.get("classification")=="noncanonical-playtest" for d in x["diagnostics"]) for x in included)
          PY
