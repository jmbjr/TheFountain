name: Build Wretched Beta TTS

on:
  push:
    branches:
      - main
    paths:
      - "game/wretched-demesne.dodge.v0.2.1.json"
      - "game/wretched-demesne.scenario-01.mvp.v0.1.json"
      - "game/export-contracts/wretched-beta-tts.dodge-export.json"
      - "tools/export_wretched_beta_tts.py"
      - ".github/workflows/wretched-beta-tts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Build TTS save and generated card faces
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          python tools/export_wretched_beta_tts.py --git-sha "$GITHUB_SHA"
          printf '{"git_sha":"%s","artifact":"wretched-demesne-scenario-01-beta-tts-%s.json"}\n' "$GITHUB_SHA" "$SHORT_SHA" > wretched-demesne/beta/tts-build.json
      - name: Commit generated Beta TTS artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wretched-demesne/beta/tts/
          git add wretched-demesne/beta/tts-build.json
          git add wretched-demesne/beta/downloads/wretched-demesne-scenario-01-beta-tts-*.json
          git diff --cached --quiet && exit 0
          git commit -m "Build Wretched beta TTS save"
          git push
