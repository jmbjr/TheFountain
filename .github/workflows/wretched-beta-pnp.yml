name: Build Wretched Beta Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "wretched-demesne/beta/downloads/**"
      - "wretched-demesne/beta/tts/assets/**"
      - "wretched-demesne/beta/build.json"
      - "wretched-demesne/beta/tts-build.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pillow

      - name: Validate exporters and PnP geometry
        run: |
          python -m py_compile tools/export_wretched_beta_pnp.py tools/export_wretched_beta_tts.py
          grep -q 'doc=BaseDocTemplate' tools/export_wretched_beta_pnp.py
          grep -q 'topPadding=0,bottomPadding=0' tools/export_wretched_beta_pnp.py
          if grep -q 'doc=SimpleDocTemplate' tools/export_wretched_beta_pnp.py; then exit 1; fi
          python -c "from reportlab.lib.pagesizes import letter; from reportlab.lib.units import mm,inch; s=3*88*mm; f=letter[1]-2*.20*inch; assert s <= f"
          grep -Eq '(wretched-beta-web\.js\?build=(SOURCE_BUILD|[0-9a-f]{12})|\./web/[0-9a-f]{12}/renderers/wretched-beta-web\.js)' wretched-demesne/beta/index.html
          grep -q 'src/renderers/wretched-beta-web.js' .github/workflows/wretched-beta-pnp.yml
          grep -q 'src/wretched/engine.js' .github/workflows/wretched-beta-pnp.yml
          grep -q 'src/wretched/replay.js' .github/workflows/wretched-beta-pnp.yml
          grep -q 'game/wretched-demesne.dodge.v0.2.1.json' .github/workflows/wretched-beta-pnp.yml
          grep -q 'tools/resolve_wretched_dodge.py' .github/workflows/wretched-beta-pnp.yml
          if grep -Eq 'wretched-beta-web\.js\?v=[0-9]{8}|from "[^"]+\.js\?v=|\.json\?(v|build)=[0-9]{8}' wretched-demesne/beta/index.html src/renderers/wretched-beta-web.js; then echo "Manual Beta cache tag detected"; exit 1; fi

      - name: Build matching PnP and TTS artifacts
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          python tools/export_wretched_beta_pnp.py --git-sha "$GITHUB_SHA"
          python tools/export_wretched_beta_tts.py --git-sha "$GITHUB_SHA"
          TTS_JSON="wretched-demesne-scenario-01-beta-tts-${SHORT_SHA}.json"
          TTS_ZIP="wretched-demesne-scenario-01-beta-tts-${SHORT_SHA}.zip"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/assets"
          cp "wretched-demesne/beta/downloads/$TTS_JSON" "$STAGE/"
          cp -R "wretched-demesne/beta/tts/assets/${SHORT_SHA}/." "$STAGE/assets/"
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/wretched-demesne/beta/downloads/$TTS_ZIP" .)
          printf '{"git_sha":"%s","artifact":"%s","save":"%s"}\n' "$GITHUB_SHA" "$TTS_ZIP" "$TTS_JSON" > wretched-demesne/beta/tts-build.json
          printf '{"git_sha":"%s"}\n' "$GITHUB_SHA" > wretched-demesne/beta/build.json
          sed -i -E "s|(<code id=\"git-build\">)[^<]*(</code>)|\\1${SHORT_SHA}\\2|" wretched-demesne/beta/index.html
          WEB_DIR="wretched-demesne/beta/web/${SHORT_SHA}"
          rm -rf wretched-demesne/beta/web
          mkdir -p "$WEB_DIR/renderers" "$WEB_DIR/wretched" "$WEB_DIR/game"
          cp src/renderers/wretched-beta-web.js "$WEB_DIR/renderers/"
          cp src/wretched/engine.js src/wretched/model.js src/wretched/random.js src/wretched/replay.js src/wretched/topology-view.js "$WEB_DIR/wretched/"
          python tools/resolve_wretched_dodge.py --out "$WEB_DIR/game/wretched-resolved-game.v1.json"
          sed -i 's|../../game/wretched-resolved-game.v1.json|../game/wretched-resolved-game.v1.json|g' "$WEB_DIR/renderers/wretched-beta-web.js"
          sed -i -E "s|(<script type=\\\"module\\\" src=\\\")[^\\\"]*wretched-beta-web\\.js[^\\\"]*(\\\"></script>)|\\1./web/${SHORT_SHA}/renderers/wretched-beta-web.js\\2|" wretched-demesne/beta/index.html
          test -f "$WEB_DIR/renderers/wretched-beta-web.js"
          test -f "$WEB_DIR/wretched/engine.js"
          test -f "$WEB_DIR/game/wretched-resolved-game.v1.json"
          grep -q 'from "../wretched/engine.js"' "$WEB_DIR/renderers/wretched-beta-web.js"
          grep -q 'loadWretchedResolved("../game/wretched-resolved-game.v1.json")' "$WEB_DIR/renderers/wretched-beta-web.js"
          WEB_DIR="$WEB_DIR" python - <<'PY'
          import os
          from pathlib import Path
          web_dir = Path(os.environ["WEB_DIR"])
          model = web_dir / "wretched/model.js"
          data_ref = "../game/wretched-resolved-game.v1.json"
          resolved_path = (model.parent / data_ref).resolve()
          expected = (web_dir / "game/wretched-resolved-game.v1.json").resolve()
          assert resolved_path == expected, (resolved_path, expected)
          assert expected.is_file(), expected
          import json
          game = json.loads(expected.read_text())
          assert game["format"] == "wretched-resolved-game.v1"
          assert game["dodge_version"] == "0.2.1"
          expected_decks={"captain":10,"security":10,"engineer":10,"medic":11,"scout":10}
          for crew,total in expected_decks.items():
              collection=game["semantic_collections"][f"{crew}-starter-deck-1"]
              assert sum(m.get("quantity",1) for m in collection["members"]) == total
          expected_runtime_collections={"scenario-room-cards-1":10,"scenario-encounter-cards-1":6,"scenario-salvage-cards-1":8}
          for instance_id,total in expected_runtime_collections.items():
              assert sum(m.get("quantity",1) for m in game["semantic_collections"][instance_id]["members"]) == total
          PY
          grep -q "./web/${SHORT_SHA}/renderers/wretched-beta-web.js" wretched-demesne/beta/index.html
          sed -i -E "s|wretched-demesne-scenario-01-beta-pnp-[^\"]*\.pdf|wretched-demesne-scenario-01-beta-pnp-${SHORT_SHA}.pdf|" wretched-demesne/beta/index.html
          sed -i -E "s|wretched-demesne-scenario-01-beta-tts-[^\"]*\.zip|wretched-demesne-scenario-01-beta-tts-${SHORT_SHA}.zip|" wretched-demesne/beta/index.html

      - name: Commit generated Beta release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wretched-demesne/beta/index.html wretched-demesne/beta/build.json wretched-demesne/beta/tts-build.json
          git add wretched-demesne/beta/web/
          git add wretched-demesne/beta/tts/
          git add wretched-demesne/beta/downloads/wretched-demesne-scenario-01-beta-pnp-*.pdf
          git add wretched-demesne/beta/downloads/wretched-demesne-scenario-01-beta-tts-*.json
          git add wretched-demesne/beta/downloads/wretched-demesne-scenario-01-beta-tts-*.zip
          git diff --cached --quiet && exit 0
          git commit -m "Build Wretched beta release"
          git push
