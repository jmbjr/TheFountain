name: Build Wretched Beta PnP
on:
  push:
    branches: [main]
    paths:
      - "game/wretched-demesne.dodge.v0.2.1.json"
      - "game/wretched-demesne.scenario-01.mvp.v0.1.json"
      - "tools/export_wretched_beta_pnp.py"
      - ".github/workflows/wretched-beta-pnp.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - run: python tools/export_wretched_beta_pnp.py
      - name: Commit generated beta PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wretched-demesne/beta/downloads/wretched-demesne-scenario-01-beta-pnp.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Build Wretched beta PnP PDF"
          git push
